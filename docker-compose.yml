# ─────────────────────────────────────────────────────────────────────────────
# Biomarker Pipeline — Docker Compose
#
# Start:   docker compose up --build
# Stop:    docker compose down
# Logs:    docker compose logs -f
#
# App opens at:  http://localhost:8501
# API opens at:  http://localhost:8001
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI backend (runs the 6-agent pipeline) ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env                    # loads your API keys (ANTHROPIC_API_KEY etc.)
    ports:
      - "8001:8001"
    restart: unless-stopped
    # Health check — waits until /health returns 200 before frontend starts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Streamlit frontend (the UI) ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file: .env
    ports:
      - "8501:8501"
    environment:
      # Points the frontend at the backend service (not localhost)
      BACKEND_URL: http://backend:8001
    depends_on:
      backend:
        condition: service_healthy   # waits for backend /health to pass
    restart: unless-stopped
